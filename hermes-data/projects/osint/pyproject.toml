[project]
name = "osint-runner"
version = "0.1.0"
description = "Modular OSINT research runner - free API/scraping services in cascade"
requires-python = ">=3.11"

dependencies = [
    # Core HTTP
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "cloudscraper>=1.2.71",
    
    # Parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "html5lib>=1.1",
    "cssselect2>=0.9.0",
    "tldextract>=5.3.0",
    "tld>=0.13.2",
    
    # Data processing
    "python-dateutil>=2.9.0",
    "pydantic>=2.5.0",
    "email-validator>=2.1.0",
    
    # Networking / DNS
    "dnspython>=2.4.0",
    "scapy>=2.7.0",
    "python-whois>=0.9.0",
    
    # Geo / IP
    "maxminddb>=2.2.0",
    "geopy>=2.4.0",
    
    # Document parsing
    "pdfminer.six>=20231228",
    "PyPDF2>=3.0.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    
    # Tor / Dark web
    "stem>=1.8.0",
    "torrequest>=0.1.0",
    "PySocks>=1.7.1",
    "aiohttp-socks>=0.10.0",
    
    # Breach / Leak
    "h8mail>=2.5.0",
    "holehe>=1.6.0",
    "maigret>=0.5.0",
    "sherlock-project>=0.16.0",
    
    # Social / Username
    "socialscan>=2.0.0",
    "socid-extractor>=0.0.27",
    
    # Recon / Enum
    "sublist3r>=1.0.0",
    "photon>=1.1.8",
    "wappalyzer>=1.0.0",
    "ghunt>=2.3.0",
    
    # Selenium (for JS rendering)
    "selenium>=4.15.0",
    
    # Utils
    "tqdm>=4.67.0",
    "colorama>=0.4.6",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    # recon-ng>=5.0.0  # not on PyPI, installed manually via git clone
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=66.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

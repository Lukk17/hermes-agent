services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.fork
      args:
        BASE_IMAGE: hermes-agent:upstream
        VCS_REF: ${VCS_REF:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: hermes-agent:fork
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hermes-data:/opt/data
      - ./fork/projects:/opt/projects
      - ./.agents/skills:/opt/external-skills:ro
      - ./skills:/opt/skills:ro
      # Fork-specific overrides for files we change often. hermes-data:/opt/data
      # provides the runtime state; these overrides shadow the same paths.
      - ./fork/hermes-config/SOUL.md:/opt/data/SOUL.md
      - ./fork/hermes-config/config.yaml:/opt/data/config.yaml
      # cron/scheduler.py refuses any script outside $HERMES_HOME/scripts, and
      # that dir lives under the gitignored hermes-data mount — track the
      # wrapper here so it reaches every machine.
      - ./fork/hermes-config/scripts/crypto-monitor-daily.sh:/opt/data/scripts/crypto-monitor-daily.sh
    environment:
      - PATH=/opt/hermes/bin:/opt/pyenv/shims:/opt/pyenv/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/bin:/usr/bin:/bin
      # Messaging
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Behavioural Discord settings live in config.yaml (discord.*); env wins
      # over YAML, so passing them here would pin them. This one has no
      # config.yaml path at all, so it stays.
      - DISCORD_COMMAND_SYNC_POLICY=${DISCORD_COMMAND_SYNC_POLICY:-off}
      # Scoped write sandbox. The upstream image bakes in
      # HERMES_WRITE_SAFE_ROOT=/opt/data, but the fork keeps its tracked source
      # under /opt/projects/ (mounted from ./fork/projects on the host). Set the
      # var to both paths so the agent can edit fork config and project code.
      # Colon-separated list of roots (hermes parses with os.pathsep).
      # Note: setting this to "off" or empty does NOT disable the sandbox. The
      # code at agent/file_safety.py resolves the string via realpath and adds
      # it to the roots set, so a bogus string becomes a bogus single root that
      # blocks everything else. To actually allow all writes, set it to "/" or
      # list every directory the agent should be able to write to.
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/opt/projects

      # LLM provider
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}

      # On-chain
      - BLOCKSCOUT_API_KEY=${BLOCKSCOUT_API_KEY}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - CRYPTOPANIC_API_KEY=${CRYPTOPANIC_API_KEY}

      # Gmail OAuth
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}

      # OSINT / threat-intel
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - ABSTRACT_API_KEY=${ABSTRACT_API_KEY}
      - EMAILREP_API_KEY=${EMAILREP_API_KEY}
      - NUMVERIFY_API_KEY=${NUMVERIFY_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - CENSYS_API_KEY=${CENSYS_API_KEY}
      - IPQS_API_KEY=${IPQS_API_KEY}
      - DEHASHED_API_KEY=${DEHASHED_API_KEY}
      - BREACHDIRECTORY_VIA_RAPIDAPI_API_KEY=${BREACHDIRECTORY_VIA_RAPIDAPI_API_KEY}

      - ASCEND_SCRAPPER_URL=${ASCEND_SCRAPPER_URL}

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.fork
      args:
        BASE_IMAGE: hermes-agent:upstream
        VCS_REF: ${VCS_REF:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: hermes-agent:fork-dashboard
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ./hermes-data:/opt/data
      # Dashboard reads SOUL.md for the persona banner only; skip skills + cron
      - ./fork/hermes-config/SOUL.md:/opt/data/SOUL.md
    command: ["dashboard", "--host", "127.0.0.1", "--port", "9119", "--no-open"]

  # Builds the upstream image that Dockerfile.fork's BASE_IMAGE points at.
  # Never started: it exists only to give `docker compose build` a target for
  # the untouched upstream Dockerfile.
  upstream-base:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent:upstream
    command: ["true"]
